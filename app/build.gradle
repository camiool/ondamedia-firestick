plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.ondamedia.tv'
    compileSdk 34

    defaultConfig {
        // Otro identificador que la versión WebView, para tener las dos instaladas y comparar.
        applicationId 'cl.ondamedia.tv.nativa'
        minSdk 22          // Fire TV Stick (Fire OS 5 en adelante)
        targetSdk 34
        versionCode 1
        versionName '2.0-nativa'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave debug para poder instalarlo directo (sideload)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Reproductor de video nativo (HLS)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // Listas de películas
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Carga y caché de imágenes
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
